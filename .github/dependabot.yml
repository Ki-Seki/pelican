version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it is proposed: time for a bad or hijacked one to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The Agent SDK has an entry of its own, below.
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      # Node's types follow the oldest Node Pelican supports (engines), so they cannot offer APIs
      # it lacks; they move with that floor, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jsdom 30's dependencies need a newer Node than the 22.12 Pelican tests on.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
  # The Agent SDK brings the Claude Code that Pelican runs, and a new one ships most days: each
  # gets a pull request of its own, which runs all the checks and the browser smoke test, and
  # sdk-report.yml comments on it with what changed upstream.
  - package-ecosystem: npm
    directory: /
    # Dependabot takes a second entry for the same folder only on another target branch; naming
    # the default branch, which the entry above leaves implicit, counts as one
    # (dependabot/dependabot-core#1778).
    target-branch: main
    schedule:
      interval: daily
    # One day, not seven: a release Anthropic replaces within hours is skipped, a bad or hijacked
    # one has a day to be caught and pulled, and a new Claude Code still reaches Pelican the next
    # day rather than the next week.
    cooldown:
      default-days: 1
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
