name: Site

# The project site and its live demo, published to GitHub Pages once CI has passed on the same
# commit of main: the demo never runs ahead of what the checks saw. Only the commit main is at
# now is published, so an older commit whose checks pass late (run again by hand) changes nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  newest:
    name: Still the newest commit of main
    # A push to this repository's main, never a pull request from a fork whose branch is also
    # called main: this workflow runs with the rights to publish.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      newest: ${{ steps.main.outputs.newest }}
    steps:
      - name: Compare with main as it is now
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head: $SHA is not published."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the site
    needs: newest
    if: needs.newest.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run build
      - name: Assemble the site and its live demo
        run: node scripts/site.mjs _site
      - name: Check the site and its live demo in a browser
        run: node scripts/smoke.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
