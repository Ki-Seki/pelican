name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The oldest Node package.json allows, the one most people have, the newest LTS, and a Mac.
      matrix:
        node: ["22.12.0", "24", "26"]
        os: [ubuntu-latest]
        include:
          - node: "26"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The terminal's PTY, for every platform as package-lock.json pins it and as npm installed it
      # here, is Microsoft's node-pty, file for file, and the version pinned names exactly those
      # platform packages, which an install from npm takes (the package ships no shrinkwrap).
      - name: The terminal's binaries are Microsoft's
        run: node scripts/pty-binaries.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: The app and the site in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails on any page error, console error, failed request or HTTP error (Chrome is on the runner).
      - name: The app, through pelican --demo
        run: node scripts/smoke.mjs
      - name: The site and its live demo, as GitHub Pages would serve them
        run: |
          node scripts/site.mjs _site
          node scripts/smoke.mjs _site

  package:
    name: Pack, install and start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run build
      - run: npm pack
      # The notices of the packages built in, which the build wrote, go with it.
      - run: tar -tzf pelican-cc-*.tgz | grep -qx 'package/THIRD_PARTY_NOTICES'
      # As `npm install -g pelican-cc` installs it from npm, which reads a package's
      # npm-shrinkwrap.json only when the registry says it has one, never from a tarball installed
      # by its path: a registry on the runner hands the package out as npm's does. Its own npm
      # cache, so the one setup-node keeps for the other jobs stays as it is. Pelican alone: no
      # Agent SDK, which Pelican fetches itself, and with it no Claude Code, as Pelican runs yours.
      # The demo needs neither, and fetches nothing.
      - name: Install the package as people get it, and serve the demo from it
        run: |
          node scripts/registry.mjs pelican-cc-*.tgz npm install -g pelican-cc --cache "$RUNNER_TEMP/npm-cache"
          pelican --version
          if find "$(npm root -g)" -path '*/@anthropic-ai/claude-agent-sdk*' -print | grep .; then echo 'An Agent SDK package came with pelican-cc'; exit 1; fi
          # One terminal PTY, this computer's.
          test "$(ls "$(npm root -g)/pelican-cc/node_modules/@lydell" | grep -c '^node-pty-')" = 1
          export PELICAN_STATE_DIR="$RUNNER_TEMP/demo-state"
          pelican --demo --port 7861 &
          for i in $(seq 1 30); do curl -fsS -H 'X-Pelican: 1' http://127.0.0.1:7861/api/info && break; sleep 1; done
          curl -fsS -H 'X-Pelican: 1' http://127.0.0.1:7861/api/sessions | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); if (d.sessions.length < 3) process.exit(1)'
          curl -fsS http://127.0.0.1:7861/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Pelican: 1' -H 'Host: attacker.example' http://127.0.0.1:7861/api/info)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7861/api/info)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Pelican: 1' -H 'Sec-Fetch-Site: cross-site' http://127.0.0.1:7861/api/info)" = 403
          test -z "$(find "$PELICAN_STATE_DIR" -name agent-sdk)"
      - name: Without the demo, only the printed link signs a browser in
        run: |
          export PELICAN_CONFIG_DIR="$RUNNER_TEMP/config" PELICAN_STATE_DIR="$RUNNER_TEMP/state"
          pelican --port 7862 > "$RUNNER_TEMP/pelican.log" &
          for i in $(seq 1 30); do curl -fsS -H 'X-Pelican: 1' http://localhost:7862/api/auth && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Pelican: 1' http://localhost:7862/api/sessions)" = 401
          # Not in the log (stdout is a file there): `pelican token` prints the link.
          if grep -q 'token=' "$RUNNER_TEMP/pelican.log"; then echo 'The sign-in link is in the log'; exit 1; fi
          link=$(pelican token --port 7862)
          case "$link" in http://localhost:7862/?token=*) ;; *) exit 1 ;; esac
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$RUNNER_TEMP/cookies" "$link")" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/cookies" -H 'X-Pelican: 1' http://localhost:7862/api/sessions)" = 200
          # The session list waited for the Agent SDK, which Pelican fetched from npm as it started:
          # the version pinned, its JavaScript alone, with no Claude Code of its own beside it.
          sdk="$RUNNER_TEMP/state/agent-sdk/$(node -p 'require("./package.json").devDependencies["@anthropic-ai/claude-agent-sdk"]')/node_modules/@anthropic-ai"
          test -f "$sdk/claude-agent-sdk/sdk.mjs"
          # Its peers come with it (the API client, MCP's SDK, zod); Claude Code, built for each platform, does not.
          if ls "$sdk" | grep '^claude-agent-sdk-'; then echo 'Claude Code came with the Agent SDK'; exit 1; fi
          grep -q "Fetching Anthropic's Agent SDK" "$RUNNER_TEMP/pelican.log"
          # The terminal as installed: its PTY loads, and a shell starts in a folder and is closed.
          curl -fsS -b "$RUNNER_TEMP/cookies" -H 'X-Pelican: 1' http://localhost:7862/api/terminals | grep -q '"available":true'
          id=$(curl -fsS -b "$RUNNER_TEMP/cookies" -H 'X-Pelican: 1' -H 'Content-Type: application/json' \
            -d "{\"cwd\":\"$RUNNER_TEMP\",\"cols\":80,\"rows\":24}" http://localhost:7862/api/terminals \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).terminal.id)')
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -b "$RUNNER_TEMP/cookies" -H 'X-Pelican: 1' "http://localhost:7862/api/terminals/$id")" = 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pelican-cc-*.tgz
          if-no-files-found: error
          retention-days: 7
