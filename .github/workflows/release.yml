name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/pelican-cc
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing (no token: npm trusts this workflow, in the npm environment, by OIDC)
      # needs npm 11.5.1 or later.
      - name: npm new enough for trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" || npm install -g npm@11.15.0
          npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish with provenance (npm trusted publishing)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # A version published by hand already (the first release was) is not published again.
          if npm view "pelican-cc@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
            echo "pelican-cc@${RELEASE_TAG#v} is on npm already"
          else
            npm publish ./pelican-cc-*.tgz --provenance --access public
          fi
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" pelican-cc-*.tgz --repo "$GITHUB_REPOSITORY"
