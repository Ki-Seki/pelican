name: Agent SDK report

# For a pull request that moves the pinned Agent SDK (Dependabot opens one for each new version):
# what changed upstream, from scripts/upstream-report.mjs. This runs the pull request's code, so
# with no more rights than any pull request has; sdk-report-comment.yml posts the report, running
# only code from main.
on:
  pull_request:
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: What changed upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the head of the branch it goes into.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The script takes exact versions only, so nothing else in package.json reaches a command.
      - name: Write the report, when the pinned version changes
        run: |
          # Where the pin is: dependencies before 0.6.0, devDependencies since, as Pelican fetches the SDK itself.
          pin() { node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(String(p.devDependencies?.["@anthropic-ai/claude-agent-sdk"] ?? p.dependencies?.["@anthropic-ai/claude-agent-sdk"] ?? ""))'; }
          from=$(git show HEAD^1:package.json | pin)
          to=$(pin < package.json)
          if [ "$from" = "$to" ]; then
            echo "The Agent SDK stays at $from."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/sdk-report"
          node scripts/upstream-report.mjs "$from" "$to" > "$RUNNER_TEMP/sdk-report/report.md"
          # All of it, the whole diff too, on this run's page; the comment links here.
          node scripts/upstream-report.mjs "$from" "$to" --full >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-report
          path: ${{ runner.temp }}/sdk-report/report.md
          if-no-files-found: ignore
          retention-days: 7
